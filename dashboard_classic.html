<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a; --panel: #111214; --fg: #f7f8f8; --sec: #d0d6e0; --line: #2c2e34;
    --up: #3dd68c; --dn: #ff7b83; --warn: #f5b942; --accent: #7170ff;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .dn { color: var(--dn); } .sec { color: var(--sec); } .warn { color: var(--warn); }

  .app { height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding: 8px; }

  /* header */
  .header-fx { position: relative; isolation: isolate; overflow: hidden; flex: none; display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; justify-content: space-between; gap: 12px;
               border-radius: 14px; padding: 10px 16px; background: #0f172a80; border: 1px solid #ffffff12; }
  .header-fx::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: linear-gradient(90deg, #ef444422 0% 14.28571%, #f9731622 14.28571% 28.57143%, #facc1522 28.57143% 42.85714%, #22c55e22 42.85714% 57.14286%, #38bdf822 57.14286% 71.42857%, #6366f122 71.42857% 85.71429%, #a855f722 85.71429% 100%);
    animation: header-rainbow-pulse 8s ease-in-out infinite; pointer-events: none; }
  .header-fx::after { content: ""; position: absolute; bottom: 0; left: 16px; right: 16px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #ef4444 0% 14.28571%, #f97316 14.28571% 28.57143%, #facc15 28.57143% 42.85714%, #22c55e 42.85714% 57.14286%, #38bdf8 57.14286% 71.42857%, #6366f1 71.42857% 85.71429%, #a855f7 85.71429% 100%);
    animation: header-rainbow-pulse 6s ease-in-out infinite; opacity: .75; pointer-events: none; }
  .header-fx > * { position: relative; z-index: 1; }
  @keyframes header-rainbow-pulse { 0%, 100% { filter: brightness(.85); opacity: .65; } 50% { filter: brightness(1.3); opacity: 1; } }
  .brand { display: flex; align-items: center; gap: 15px; }
  .logo-space { perspective: 450px; width: 54px; height: 58px; flex: none; }
  .logo { width: 54px; height: 58px; position: relative; transform-style: preserve-3d; animation: logo-float 7s ease-in-out infinite; filter: drop-shadow(0 8px 8px #a78bfa40); }
  .logo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .logo .depth { transform: translateZ(-5px) translate(3px,3px); filter: brightness(.32); }
  .logo .face { transform: translateZ(3px); }
  @keyframes logo-float { 0%, 100% { transform: rotateX(9deg) rotateY(-18deg) translateY(0); } 50% { transform: rotateX(-8deg) rotateY(22deg) translateY(-4px); } }
  .brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -1px; color: #fff; line-height: 1; }
  .brand p { margin-top: 4px; font-size: 12px; color: #94a3b8; line-height: 1; }
  .chips { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid #334155; background: #1e293b;
          padding: 4px 4px 4px 10px; color: #cbd5e1; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--up); display: inline-block; }
  .chip i.warn { background: var(--warn); } .chip i.bad { background: var(--dn); }
  .chip .stamp { font-family: var(--mono); font-size: 10px; color: #cbd5e1; }
  .chip button { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #cbd5e1; }
  .chip button:hover { background: #334155; color: #fff; }
  .chip button svg { width: 14px; height: 14px; }
  .chip button.spin svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pill { border-radius: 7px; border: none; background: #1e293b; padding: 6px 10px; font-weight: 600; font-size: 12px; color: #f4f4f5; text-decoration: none; display: inline-block; }
  .pill.live { background: var(--dn); color: #fff; }
  .kill { border-radius: 7px; border: none; background: #1e293b; color: #f4f4f5; padding: 6px 10px; font-weight: 600; font-size: 12px; }
  .kill.active { background: var(--dn); color: #fff; }
  .hlink { border: 1px solid #334155; background: #0f172a; border-radius: 7px; padding: 7px 10px; color: #cbd5e1; font-size: 12px; text-decoration: none; display: inline-block; }
  .hlink:hover { color: #fff; border-color: #475569; }
  .updated { color: #94a3b8; font-family: var(--mono); font-size: 11px; }
  .updated.stale { color: #ffd479; }

  .banner { flex: none; border-radius: 10px; padding: 6px 12px; font-size: 12px; background: #2a2414; color: var(--warn); border: 1px solid #5a4a20; }
  .banner.bad { background: #2a1418; color: var(--dn); border-color: #5a2430; }

  /* ticker strip */
  .ticker { flex: none; display: grid; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
  .mkt { border-right: 1px solid var(--line); padding: 4px 8px; min-width: 0; }
  .mkt:last-child { border-right: 0; }
  .mkt .n { font-size: 10px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mkt .p { font-family: var(--mono); font-size: 14px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .mkt .c { font-family: var(--mono); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* main desk */
  .desk { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.2fr) minmax(0, .95fr); gap: 8px; }
  .panel { min-height: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 8px 12px; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .h { font-size: 11px; font-weight: 500; letter-spacing: .14em; color: var(--sec); text-transform: uppercase; }
  .h + .h, * + .h.gap { margin-top: 8px; }
  .big { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bigsub { margin-top: 4px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0; font-size: 12px; }
  .kv > span:first-child { color: var(--sec); }
  .kv > span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th { font-size: 12px; font-weight: 500; color: var(--sec); padding: 2px 0; }
  td { border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12px; padding: 4px 0; font-variant-numeric: tabular-nums; }
  th.r, td.r { text-align: right; }
  .empty { color: var(--sec); font-size: 12px; padding: 4px 0; }

  .tape { display: flex; flex-direction: column; overflow: hidden; }
  .tapehead { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .tabs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .tabs button { border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--sec); }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .chart { flex: 1; min-height: 0; position: relative; }
  #chart { position: absolute; inset: 0; }
  .tapenote { flex: none; padding-top: 4px; font-size: 12px; color: var(--sec); }

  .blot { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0; font-size: 12px; }
  .blot span:first-child { color: var(--sec); white-space: nowrap; }
  .blot span:last-child { text-align: right; }
  .rank { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; border-bottom: 1px solid var(--line); padding: 2px 0; font-size: 12px; align-items: baseline; }
  .rank .mono { text-align: right; }
  .rank .st { color: var(--sec); font-size: 11px; min-width: 64px; text-align: right; }
  .rank.held .st { color: var(--up); } .rank.pending .st { color: var(--warn); } .rank.selling .st { color: var(--dn); }

  /* bot footer */
  .bots { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .bot { border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; min-width: 0; }
  .bot.holding { border-color: #245a40; } .bot.blocked { border-color: #5a4a20; }
  .bot h3 { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 500; }
  .bot p { font-size: 12px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bot .checks { font-size: 11px; }

  @media (prefers-reduced-motion: reduce) { .header-fx::before, .header-fx::after, .logo { animation: none; } }
  @media (max-width: 1000px), (max-height: 620px) {
    body { overflow: auto; }
    .app { height: auto; }
    .desk { grid-template-columns: 1fr; }
    .chart { height: 260px; flex: none; }
    .bots { grid-template-columns: 1fr 1fr; }
    .ticker { grid-template-columns: repeat(4, 1fr) !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="header-fx">
    <div class="brand">
      <div class="logo-space" aria-hidden="true"><div class="logo"><svg class="depth" viewBox="0 0 100 100" aria-hidden="true"><path fill="#10b981" d="M5 92 44 8h18L32 92z"/><path fill="#f8fafc" d="m62 8 36 84H78L53 34zM30 69l44-24-13 23z"/></svg><svg class="face" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="aetherLogoGradient" gradientUnits="userSpaceOnUse" x1="5" y1="0" x2="98" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="14.28571%" stop-color="#ef4444"/><stop offset="14.28571%" stop-color="#f97316"/><stop offset="28.57143%" stop-color="#f97316"/><stop offset="28.57143%" stop-color="#facc15"/><stop offset="42.85714%" stop-color="#facc15"/><stop offset="42.85714%" stop-color="#22c55e"/><stop offset="57.14286%" stop-color="#22c55e"/><stop offset="57.14286%" stop-color="#38bdf8"/><stop offset="71.42857%" stop-color="#38bdf8"/><stop offset="71.42857%" stop-color="#6366f1"/><stop offset="85.71429%" stop-color="#6366f1"/><stop offset="85.71429%" stop-color="#a855f7"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs><path fill="url(#aetherLogoGradient)" d="M5 92 44 8h18L32 92z"/><path fill="url(#aetherLogoGradient)" d="m62 8 36 84H78L53 34z"/><path fill="url(#aetherLogoGradient)" d="m30 69 44-24-13 23z"/></svg></div></div>
      <div><h1>Aether</h1><p>The whole book. One glance.</p></div>
    </div>
    <div class="chips">
      <span class="updated" id="updated">loading</span>
      <span class="chip" id="st-alpaca" title="Alpaca broker connection"><i></i>Alpaca<span class="stamp"></span><button type="button" aria-label="Refresh everything"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.2-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 2.5 V5.2 H9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
      <span class="chip" id="st-vm" title="VM health"><i></i>VM<span class="stamp"></span><button type="button" aria-label="Refresh everything"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.2-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 2.5 V5.2 H9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
      <span class="chip" id="st-tg" title="Telegram alerts"><i></i>Telegram<span class="stamp"></span><button type="button" aria-label="Refresh everything"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.2-3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 2.5 V5.2 H9.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span>
      <a class="pill" id="mode" href="/">…</a>
      <span class="pill" id="paperAcct" title="Paper account: practice money, not real">…</span>
      <span class="pill" id="liveAcct" title="Live account: real money">…</span>
      <span class="kill" id="kill" title="The engine's own kill switch. It trips automatically when the daily loss limit is hit.">Kill switch …</span>
      <button class="hlink" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="ticker" id="ticker" aria-label="Markets"></section>

  <main class="desk">
    <section class="panel">
      <p class="h">Equity</p>
      <p class="big" id="eq">…</p>
      <p class="bigsub" id="eqsub"></p>
      <div id="eqkv"></div>
      <h2 class="h gap">Lots</h2>
      <div id="lots"></div>
    </section>

    <section class="panel tape">
      <div class="tapehead">
        <h2 class="h">Tape</h2>
        <div class="tabs" role="group" aria-label="Chart">
          <button type="button" data-tape="equity" aria-pressed="true">Equity</button>
          <button type="button" data-tape="SPY" aria-pressed="false">SPY</button>
          <button type="button" data-tape="QQQ" aria-pressed="false">QQQ</button>
          <button type="button" data-tape="IWM" aria-pressed="false">IWM</button>
          <button type="button" data-tape="BTC/USD" aria-pressed="false">BTC</button>
          <button type="button" data-tape="ETH/USD" aria-pressed="false">ETH</button>
        </div>
      </div>
      <div class="chart"><div id="chart"></div></div>
      <p class="tapenote"><span id="tapenote">Loading</span> · <a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView</a></p>
    </section>

    <section class="panel">
      <h2 class="h">Result</h2>
      <div id="result"></div>
      <h2 class="h gap">Blotter</h2>
      <div id="blotter"></div>
      <h2 class="h gap">Engine</h2>
      <div id="engine"></div>
      <h2 class="h gap">US ETF ranks</h2>
      <div id="ranks"></div>
    </section>
  </main>

  <footer class="bots" id="bots"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const DEMO = location.protocol === "file:";
  let overview = null, strategy = null, usStatus = null, market = null, lastOk = 0, tape = "equity", chart = null;

  // ---------- formatting (plain numbers, like a trading desk) ----------
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const MINUS = "\u2212";
  const n2 = (v, d = 2) => !isNum(v) ? "n/a" : (v < 0 ? MINUS : "") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  const s2 = (v, d = 2) => !isNum(v) ? "n/a" : (v > 0 ? "+" : v < 0 ? MINUS : "") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pc = (v, d = 2) => !isNum(v) ? "" : s2(v, d) + "%";
  const px = (v) => !isNum(v) ? "n/a" : v >= 1000 ? n2(v, 2) : v >= 1 ? n2(v, 2) : v.toPrecision(4);
  const tone = (v) => !isNum(v) || v === 0 ? "" : v > 0 ? "up" : "dn";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : null; };
  const pick = (o, ...keys) => { for (const k of keys) if (o && o[k] != null && o[k] !== "") return o[k]; return null; };
  const tsNorm = (v) => typeof v === "string" ? v.replace(/ UTC$/, "Z").replace(" ", "T") : v;
  const toDate = (v) => v == null ? null : new Date(typeof v === "number" ? v * 1000 : tsNorm(v));
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const two = (x) => String(x).padStart(2, "0");
  const when = (v) => { const d = toDate(v); return d && !isNaN(d) ? d.getDate() + " " + MON[d.getMonth()] + " " + two(d.getHours()) + ":" + two(d.getMinutes()) : ""; };
  const dayOnly = (v) => { const d = toDate(v); return d && !isNaN(d) ? d.getDate() + " " + MON[d.getMonth()] : ""; };
  const hm = (d) => two(d.getHours()) + ":" + two(d.getMinutes());
  function ago(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + "s" : s < 3600 ? Math.round(s / 60) + "m" : Math.round(s / 3600) + "h"; }
  function duration(sec) {
    if (!isNum(sec)) return "";
    const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    return d ? d + "d " + h + "h" : h ? h + "h " + m + "m" : m + "m";
  }
  const kv = (k, v, cls) => "<div class=\"kv\"><span>" + esc(k) + "</span><span class=\"" + (cls || "") + "\">" + v + "</span></div>";

  // ---------- data ----------
  async function getJSON(url) {
    if (DEMO) return demoData(url);
    const r = await fetch(url, { cache: "no-store", credentials: "same-origin" });
    if (r.status === 401) { location.href = "/login"; throw new Error("Logged out"); }
    if (!r.ok) throw new Error(url + " returned " + r.status);
    return r.json();
  }
  function heldUs() {
    return ((overview && overview.positions) || []).filter((p) => p.engine === "US ETFs").map((p) => p.symbol);
  }
  async function refresh(fromButton) {
    document.querySelectorAll(".chip button").forEach((b) => b.classList.add("spin"));
    const [o, s, u] = await Promise.allSettled([getJSON("/api/overview"), getJSON("/api/strategy"), getJSON("/api/us")]);
    const problems = [];
    if (o.status === "fulfilled") { overview = o.value; lastOk = Date.now(); } else problems.push("Account data: " + o.reason.message);
    if (s.status === "fulfilled") strategy = s.value; else problems.push("Strategy: " + s.reason.message);
    usStatus = u.status === "fulfilled" ? u.value : null;
    try { market = await getJSON("/api/market?held=" + encodeURIComponent(heldUs().join(","))); }
    catch (e) { problems.push("Market data: " + e.message); }
    render(problems);
    document.querySelectorAll(".chip button").forEach((b) => b.classList.remove("spin"));
    if (fromButton) { const t = hm(new Date()); document.querySelectorAll(".chip .stamp").forEach((x) => { x.textContent = t; }); }
    tick();
  }

  function render(problems) {
    const all = problems.concat((overview && overview.errors) || [], (market && market.errors) || []);
    const b = $("banner");
    b.hidden = !all.length;
    b.className = "banner" + (overview ? "" : " bad");
    b.textContent = all.length ? "Some numbers are missing (shown as n/a, never as zero). " + all.join(" \u00b7 ") : "";
    renderHeader(); renderTicker();
    if (!overview) return;
    renderEquity(); renderResult(); renderBlotter(); renderEngine(); renderRanks(); renderBots(); drawTape();
  }

  // ---------- header ----------
  function chip(id, state, title) {
    const c = $(id);
    c.querySelector("i").className = state === "ok" ? "" : state;
    c.title = title;
  }
  function renderHeader() {
    const h = (overview && overview.health) || {}, vm = h.vm || {};
    if (!overview) { ["st-alpaca", "st-vm", "st-tg"].forEach((id) => chip(id, "bad", "The dashboard server did not answer")); return; }
    chip("st-alpaca", h.alpaca_ok ? "ok" : "bad", h.alpaca_ok ? "Alpaca connected (" + (overview.account_mode === "LIVE" ? "live" : "paper") + " account)" : "Alpaca unreachable or rejecting requests");
    const vmWarn = (vm.disk_used_pct > 85) || (vm.mem_used_pct > 90) || (vm.cpus && vm.load5 > vm.cpus);
    chip("st-vm", vmWarn ? "warn" : "ok", "VM: engine up " + duration(h.engine_uptime_s) + ", disk " + vm.disk_used_pct + "%, memory " + vm.mem_used_pct + "%, load " + (isNum(vm.load5) ? vm.load5.toFixed(2) : "?"));
    chip("st-tg", h.telegram ? "ok" : "warn", h.telegram ? "Telegram alerts on" : "Telegram alerts off: token or chat ID not set");
    const m = $("mode");
    m.textContent = overview.account_mode === "LIVE" ? "LIVE" : "PAPER";
    m.className = "pill" + (overview.account_mode === "LIVE" ? " live" : "");
    m.title = (overview.account_mode === "LIVE" ? "Live account: real money" : "Paper account: practice money") + ". Click to go back to the main view.";
    const acc = overview.accounts || {}, pp = acc.paper, lv = acc.live;
    const fmt = (a) => !a || !a.configured ? null : n2(isNum(a.equity) ? a.equity : 0, 2);
